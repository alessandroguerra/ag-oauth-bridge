<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>AG Cloud Auth Bridge</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: radial-gradient(circle at top, #0f172a 0%, #07090e 70%);
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      width: 100%;
      max-width: 390px;
      background: rgba(15, 23, 42, 0.92);
      border: 1px solid rgba(0, 240, 255, 0.28);
      border-radius: 22px;
      padding: 28px 22px;
      text-align: center;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.75);
    }
    .icon { font-size: 2.6rem; margin-bottom: 12px; }
    h1 { font-size: 1.15rem; font-weight: 800; margin-bottom: 8px; color: #fff; }
    p { font-size: 0.85rem; color: #94a3b8; line-height: 1.45; margin-bottom: 22px; }
    .btn {
      width: 100%;
      padding: 14px 18px;
      border-radius: 14px;
      border: none;
      background: linear-gradient(135deg, #00f0ff, #10b981);
      color: #04131a;
      font-size: 0.96rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 8px 25px rgba(0, 240, 255, 0.3);
    }
    .btn:active { transform: scale(0.98); }
    .back-link {
      display: inline-block;
      margin-top: 16px;
      font-size: 0.78rem;
      color: #64748b;
      text-decoration: none;
    }
    .status {
      margin-top: 14px;
      font-size: 0.8rem;
      color: #38bdf8;
      min-height: 1.2em;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">☁️</div>
    <h1>Autorizzazione Google Drive</h1>
    <p>Tocca il pulsante qui sotto per selezionare il tuo account Google e tornare automaticamente ad <strong>AG Mobile Player</strong>.</p>
    <button id="authBtn" class="btn" type="button">🔐 Continua con Google Drive</button>
    <div id="statusMsg" class="status"></div>
    <a id="cancelLink" class="back-link" href="https://ag-mobile-player.onrender.com/">← Torna al Player</a>
  </div>

  <script>
    (function () {
      const DEFAULT_CLIENT_ID = "31946341227-cf4lhvor1dfgnh5tubdm79hon7vr3906.apps.googleusercontent.com";
      const params = new URLSearchParams(window.location.search);
      const returnTo = params.get("return_to") || "https://ag-mobile-player.onrender.com/";
      const uk = params.get("uk") || "";
      const cid = (params.get("cid") || DEFAULT_CLIENT_ID).trim();

      const authBtn = document.getElementById("authBtn");
      const statusMsg = document.getElementById("statusMsg");
      const cancelLink = document.getElementById("cancelLink");
      if (cancelLink && returnTo) cancelLink.href = returnTo;

      function launchOAuth() {
        if (!window.google || !window.google.accounts || !window.google.accounts.oauth2) {
          statusMsg.textContent = "Caricamento Google Identity... riprova tra 1 secondo.";
          setTimeout(launchOAuth, 700);
          return;
        }
        statusMsg.textContent = "Apertura finestra Google...";
        const tokenClient = window.google.accounts.oauth2.initTokenClient({
          client_id: cid,
          scope: "https://www.googleapis.com/auth/drive",
          callback: (resp) => {
            if (resp && resp.access_token) {
              statusMsg.textContent = "✅ Autorizzato! Ritorno al Player...";
              const expiresSec = parseInt(resp.expires_in || "3500", 10);
              const expTimestamp = String(Date.now() + (expiresSec - 60) * 1000);
              const sep = returnTo.includes("#") ? "&" : "#";
              window.location.href = `${returnTo}${sep}ag_token=${encodeURIComponent(resp.access_token)}&ag_exp=${encodeURIComponent(expTimestamp)}${uk ? `&uk=${encodeURIComponent(uk)}` : ""}`;
            } else {
              statusMsg.textContent = "Autorizzazione annullata o non riuscita.";
            }
          }
        });
        tokenClient.requestAccessToken({ prompt: "" });
      }

      authBtn.addEventListener("click", launchOAuth);
    })();
  </script>
</body>
</html>
